[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-infer"
version = "0.3.11"
description = "Bayesian inference workflows for AlphaFold-derived ensembles"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Ma Lab"}]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.5",
  "matplotlib>=3.5",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.scripts]
AF-sample = "af_sample.cli:main"
bayes-infer = "bayes_infer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
